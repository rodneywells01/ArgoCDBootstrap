{{- if .Values.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name | quote }}}
  policyTypes: [Ingress]
  {{- if .Values.ingress.enabled }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- required "networkPolicy.ingressNamespaceLabels must identify the ingress controller namespace" .Values.networkPolicy.ingressNamespaceLabels | toYaml | nindent 14 }}
      ports: [{protocol: TCP, port: 4180}]
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 1.1.3
    chart: argocd-image-updater
    helm:
      releaseName: argocd-image-updater
      valuesObject:
        replicaCount: 1
        createClusterRoles: true
        rbac:
          enabled: true
        extraArgs:
          - --interval
          - 10m
          - --max-concurrent-apps
          - "1"
          - --max-concurrent-reconciles
          - "1"
        config:
          log.level: info
          registries:
            - name: GitHub Container Registry
              prefix: ghcr.io
              api_url: https://ghcr.io
              ping: yes
        metrics:
          enabled: false
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

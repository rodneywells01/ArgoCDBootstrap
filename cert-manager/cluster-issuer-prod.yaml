apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt production server (trusted certificates)
    server: https://acme-v02.api.letsencrypt.org/directory
    # IMPORTANT: Change this to your real email address
    email: your-email@tradely.live
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      # HTTP-01 challenge solver using nginx ingress
      - http01:
          ingress:
            class: nginx

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    targetRevision: v1.19.2
    chart: cert-manager
    helm:
      valuesObject:
        # Install CRDs
        crds:
          enabled: true

        # Minimal resource configuration for cert-manager controller
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi

        # Webhook configuration with minimal resources
        webhook:
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi

        # CA Injector configuration with minimal resources
        cainjector:
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi

        # Startup API check job
        startupapicheck:
          enabled: true
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi

        # Global settings
        global:
          leaderElection:
            namespace: cert-manager

        # Feature gates - disable PathType Exact to work with ingress-nginx
        featureGates: "ACMEHTTP01IngressPathTypeExact=false"

        # Use public recursive resolvers for HTTP-01 self-checks to avoid cluster DNS cache delays.
        extraArgs:
          - --acme-http01-solver-nameservers=1.1.1.1:53,8.8.8.8:53

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
